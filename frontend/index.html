<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gurupadukam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sindhoor: '#5C0A20',
            sindhoorDark: '#380311',
            sandal: '#FDF6E3',
            gold: '#C9943A',
            goldLight: '#E8C27A'
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            garamond: ['EB Garamond', 'serif']
          },
          keyframes: {
            floatUp: {
              '0%': { transform: 'translateY(0) scale(1)', opacity: 1 },
              '100%': { transform: 'translateY(-150px) scale(1.5)', opacity: 0 }
            },
            pulseGlow: {
              '0%, 100%': { boxShadow: '0 0 20px rgba(201,148,58,0.5)' },
              '50%': { boxShadow: '0 0 40px rgba(201,148,58,0.9)' }
            },
            slideIn: {
              '0%': { transform: 'translateX(100%)' },
              '100%': { transform: 'translateX(0)' }
            },
            toastSlideUp: {
              '0%': { transform: 'translate(-50%, 100%)', opacity: 0 },
              '100%': { transform: 'translate(-50%, 0)', opacity: 1 }
            }
          },
          animation: {
            'float-up': 'floatUp 2s ease-out forwards',
            'pulse-glow': 'pulseGlow 3s infinite',
            'slideIn': 'slideIn 0.3s ease-out',
            'toast': 'toastSlideUp 0.3s ease-out forwards'
          }
        }
      }
    }
  </script>
  </head>
<body class="bg-[#FDF6E3] text-[#380311] font-garamond antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
